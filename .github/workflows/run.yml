name: Zepp Life 每日 10000 步

on:
  schedule:
    # 00:00 UTC = 北京时间 08:00
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mimotion-daily
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 提交固定步数
        env:
          USER: ${{ secrets.ZEPP_USER }}
          PWD: ${{ secrets.ZEPP_PWD }}
          FIXED_STEP: '10000'
        run: python main.py
