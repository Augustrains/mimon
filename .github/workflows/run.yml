name: Zepp Life 每日 10000 步

on:
  schedule:
    # 00:00 UTC = 北京时间 08:00
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mimotion-daily
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 读取加密令牌缓存
        env:
          AES_KEY: ${{ secrets.ZEPP_AES_KEY }}
        run: |
          if [ "${#AES_KEY}" -ne 16 ]; then
            echo 'ZEPP_AES_KEY must be a 16-character secret'
            exit 1
          fi
          base64 --decode cloud_encrypted_tokens.b64 > encrypted_tokens.data
      - name: 检查缓存账号
        env:
          USER: ${{ secrets.ZEPP_USER || secrets.USER }}
          AES_KEY: ${{ secrets.ZEPP_AES_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from util.aes_help import decrypt_data
          with open('encrypted_tokens.data', 'rb') as cache_file:
              encrypted = cache_file.read()
          try:
              cached = json.loads(decrypt_data(encrypted, os.environ['AES_KEY'].encode(), None))
          except Exception:
              print('加密缓存无法解密，请核对 ZEPP_AES_KEY')
              sys.exit(1)
          account = os.environ['USER']
          if not account.startswith('+86') and '@' not in account:
              account = '+86' + account
          if account not in cached:
              print('加密缓存与 ZEPP_USER 不匹配，请核对账号 Secret')
              sys.exit(1)
          print('加密缓存与账号匹配')
          PY
      - name: 提交固定步数
        env:
          CONFIG: ${{ secrets.CONFIG }}
          USER: ${{ secrets.ZEPP_USER || secrets.USER }}
          PWD: ${{ secrets.ZEPP_PWD || secrets.PWD }}
          AES_KEY: ${{ secrets.ZEPP_AES_KEY }}
          FIXED_STEP: '10000'
        run: python main.py
      - name: 保存更新后的加密令牌
        run: |
          base64 -w 0 encrypted_tokens.data > cloud_encrypted_tokens.b64
          printf '\n' >> cloud_encrypted_tokens.b64
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add cloud_encrypted_tokens.b64
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh encrypted Zepp token cache'
            git push origin HEAD:master
          fi
